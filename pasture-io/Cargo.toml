[package]
name = "pasture-io"
version = "0.5.0"
authors = ["Pascal Bormann <pascal.bormann@igd.fraunhofer.de>"]
edition = "2024"
license-file = "LICENSE"
description = "Support for reading and writing point cloud files with pasture"
homepage = "https://github.com/Mortano/pasture"
repository = "https://github.com/Mortano/pasture"
keywords = ["pasture", "pointcloud", "points", "lidar"]
categories = ["data-structures"]
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pasture-core = { version = "=0.5.0", path = "../pasture-core" }
pasture-derive = { version = "=0.5.0", path = "../pasture-derive" }
anyhow = { workspace = true }
las = { version = "0.11.0", features = ["laz"] }
laz = "0.12.2"
static_assertions = "1.1.0"
scopeguard = "1.1.0"
byteorder = "1.4.2"
float-ord = "0.3.2"
chrono = "0.4"
serde = { version = "1.0.125", features = ["derive"] }
serde_json = "1.0.64"
itertools = "0.15.0"
bytemuck = { workspace = true, features = ["derive"] }
array-init = "2.1"
bitfield = "0.19.5"
num-traits = "0.2.16"
lazy_static = "1.4.0"
nalgebra = { workspace = true, features = ["serde-serialize"] }

[dev-dependencies]
criterion = "0.8.2"
rand = { version = "0.10.2" }
memmap2 = "0.9.11"

[[bench]]
name = "las_bench"
harness = false
